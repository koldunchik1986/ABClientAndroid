plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-kapt'
}

// A/B-диагностика авторизации: позволяет собрать APK из снапшота app2/src_old,
// не перемещая файлы и не трогая обычную сборку.
//   обычная сборка:  ./gradlew2.bat --no-daemon
//   старый снапшот:  ./gradlew.bat --no-daemon :app2:assembleDebug -PuseOldSrc=true
def useOldSrc = project.hasProperty('useOldSrc') && project.property('useOldSrc').toString().toBoolean()

androidComponents {
    onVariants(selector().all()) { variant ->
        def appName = useOldSrc ? "anclient_OLDSRC" : "anclient"
        variant.outputs.each { output ->
            def versionName = output.versionName.getOrNull()
            output.outputFileName.set("${appName}_v${versionName}.apk")
        }
    }
}

android {
    namespace "ru.neverlands.anclient"
      compileSdk 34

    defaultConfig {
        applicationId "ru.neverlands.anclient"
        minSdkVersion 21
        targetSdkVersion 33
                        versionCode 16
                        versionName "1.1.6"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            storeFile file(RELEASE_STORE_FILE)
            storePassword RELEASE_STORE_PASSWORD
            keyAlias RELEASE_KEY_ALIAS
            keyPassword RELEASE_KEY_PASSWORD
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    tasks.withType(JavaCompile) {
        options.encoding = 'UTF-8'
        options.compilerArgs << "-Xlint:deprecation"
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
    }

    // Переключение исходников на снапшот src_old (только при -PuseOldSrc=true).
    // Нужно для сравнения рабочей авторизации старой версии с текущей.
    if (useOldSrc) {
        sourceSets {
            main {
                java.srcDirs = ['src_old/main/java']
                res.srcDirs = ['src_old/main/res']
                assets.srcDirs = ['src_old/main/assets']
                manifest.srcFile 'src_old/main/AndroidManifest.xml'
            }
        }
        logger.lifecycle("[app2] ВНИМАНИЕ: сборка из снапшота src_old (диагностика авторизации)")
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.9.0'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.6.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.1'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.6.0'
    implementation 'androidx.navigation:navigation-ui-ktx:2.6.0'
    implementation 'com.squareup.okhttp3:okhttp:4.10.0'
    implementation 'com.squareup.okhttp3:okhttp-urlconnection:4.10.0'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4'

    def room_version = "2.5.2"
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    implementation 'org.jsoup:jsoup:1.17.2'
    implementation 'com.github.bumptech.glide:glide:4.15.1'
    kapt 'com.github.bumptech.glide:compiler:4.15.1'
    kapt "androidx.room:room-compiler:$room_version"

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

import java.text.SimpleDateFormat

task backupSource(type: Zip) {
    def timestamp = new SimpleDateFormat("yyyyMMddHHmmss").format(new Date())
    def version = android.defaultConfig.versionName
    archiveFileName = "v_${version}_${timestamp}.zip"
    destinationDirectory = file("../backup")
    from('src') {
        into 'src'
    }
}

afterEvaluate {
    tasks.named('assembleDebug').configure {
        dependsOn backupSource
    }
    tasks.named('assembleRelease').configure {
        dependsOn backupSource
    }
}


